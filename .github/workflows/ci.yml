name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      # 3. Install Dependencies (YARN ✅)
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # 4. Lint
      - name: Run ESLint
        run: yarn lint

      # 5. Tests
      - name: Run Tests
        run: yarn test

      # 6. Build (optional but recommended)
      - name: Build Project
        run: yarn build